name: SmartWeld source inspection

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/windows/**"
      - ".github/workflows/smartweld-source-inspection.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official SmartWeld M-files
        shell: bash
        run: |
          set -euo pipefail
          url="https://sourceforge.net/projects/smartweld/files/Smartweld_Mfiles_12Mar2012.zip/download"
          curl -L --fail --retry 3 "$url" -o Smartweld_Mfiles_12Mar2012.zip
          echo "46714ca97f740e1430e17f0265d97e7b5a909f790ac60df91cf8d157a8fb6008  Smartweld_Mfiles_12Mar2012.zip" | sha256sum -c -

      - name: Extract and inspect source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smartweld_source
          mkdir smartweld_source
          unzip -q Smartweld_Mfiles_12Mar2012.zip -d smartweld_source
          root="smartweld_source/Smartweld_Mfiles_12Mar2012"

          {
            echo "SmartWeld M-files source inventory"
            echo
            find "$root" -type f | sort
            echo
            echo "Function declarations:"
            grep -R -n -E '^[[:space:]]*function[[:space:]]' "$root" --include='*.m' || true
          } | tee smartweld_source_inventory.txt

          mkdir -p smartweld_targeted_source
          for f in main.m queryfunc.m oslw_gui.m oslw_gui_callbacks.m oslw_gui_layout.m schedulermodels.m computeScheduleArray.m mat_file.m mcquery.m runscript.m; do
            cp "$root/$f" smartweld_targeted_source/
          done

      - name: Upload source inventory and targeted source
        uses: actions/upload-artifact@v4
        with:
          name: smartweld-source-analysis
          path: |
            smartweld_source_inventory.txt
            smartweld_targeted_source/
